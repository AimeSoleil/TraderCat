[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tradercat*"]
exclude = ["charts"]

[project]
name = "tradercat"
version = "0.1.0"
description = "A multi-symbol, multi-strategy trading bot"
authors = [{ name = "AimeSoleil", email = "jeaimesoleil@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "openbb==4.3.5",
    "openbb-technical==1.4.4",
    "pydantic>=2.11.7,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "aiohttp>=3.12.15,<4.0.0",
    "apscheduler>=3.10.4",
    "pytz>=2024.1",
    "tabulate>=0.9.0",
    "azure-ai-inference>=1.0.0b9",
    "rich>=14.2.0",
    "github-copilot-sdk>=0.1.14",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "pandas>=2.0.0",
    "exchange-calendars>=4.5.0",
    "litellm>=1.40.0",
    "PyJWT>=2.8.0"
]

[project.optional-dependencies]
dev = [
    "black==25.1.0",
    "isort==5.13.2",
    "mypy==1.10.0",
    "pytest==8.2.1",
    "pytest-asyncio==0.23.6",
    "flake8==7.0.0"
]

[project.scripts]
tradercat-api = "tradercat.main:run_api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"