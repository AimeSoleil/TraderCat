version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradercat-postgres
    environment:
      POSTGRES_USER: tradercat
      POSTGRES_PASSWORD: tradercat
      POSTGRES_DB: tradercat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradercat"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradercat-api
    environment:
      DATABASE_URL: postgresql+asyncpg://tradercat:tradercat@postgres:5432/tradercat
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      TRADERCAT_AI_TOKEN: ${TRADERCAT_AI_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
