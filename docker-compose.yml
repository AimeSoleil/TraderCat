version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradercat-postgres
    environment:
      POSTGRES_USER: tradercat
      POSTGRES_PASSWORD: tradercat
      POSTGRES_DB: tradercat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradercat"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradercat-api
    environment:
      DATABASE_URL: postgresql+asyncpg://tradercat:tradercat@postgres:5432/tradercat
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      RUN_MODE: api-only
      TRADERCAT_AI_TOKEN: ${TRADERCAT_AI_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  pipeline-worker:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: tradercat-pipeline
    environment:
      DATABASE_URL: postgresql+asyncpg://tradercat:tradercat@postgres:5432/tradercat
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      RUN_MODE: scheduler
      PIPELINE_SCHEDULE_HOUR: ${PIPELINE_SCHEDULE_HOUR:-20}
      PIPELINE_TIMEZONE: ${PIPELINE_TIMEZONE:-America/New_York}
      PIPELINE_MAX_CONCURRENCY: ${PIPELINE_MAX_CONCURRENCY:-5}
      TRADERCAT_AI_TOKEN: ${TRADERCAT_AI_TOKEN:-}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-gpt-4o}
      DEFAULT_PERSONA: ${DEFAULT_PERSONA:-wyckoff}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
